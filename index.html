<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Joaquin Lavori — Branding & Illustration</title>
<meta name="description" content="Joaquin Lavori is a graphic designer and illustrator working across branding, art direction and hand-drawn illustration." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-nav" id="siteNav"></header>

  <div class="layout" id="layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-block" id="sidebar-about">
        <h3>About</h3>
        <p id="about-text"></p>
      </div>
      <div class="sidebar-block" id="sidebar-contact">
        <div class="sidebar-row">
          <span>Consultation</span>
          <a id="book-link" href="#" class="sidebar-link">book a call</a>
        </div>
        <div class="sidebar-row">
          <span>Email</span>
          <a id="email-link" href="#" class="sidebar-link"></a>
        </div>
        <div class="sidebar-row">
          <span>Phone</span>
          <a id="phone-link" href="#" class="sidebar-link"></a>
        </div>
        <div class="sidebar-row">
          <span>Instagram</span>
          <a id="ig-link" href="#" target="_blank" rel="noopener" class="sidebar-link">follow</a>
        </div>
      </div>
      <div class="sidebar-block" id="featured-in-block">
        <h3>Featured In</h3>
        <ul id="featured-in-list" class="plain-list"></ul>
      </div>
      <div class="sidebar-block" id="awards-block">
        <h3>Awards</h3>
        <ul id="awards-list" class="plain-list"></ul>
      </div>
    </aside>

    <main class="main" id="main">

      <div class="pages-track" id="pagesTrack">

        <section class="page" id="page-home" data-page="home">
          <div class="page-scroll">
            <div class="hero" id="hero">
              <div class="hero-letters" aria-hidden="true">
                <span class="hero-letter hero-letter-j">J</span>
                <span class="hero-letter hero-letter-q">Q</span>
              </div>
              <a class="hero-media" id="heroMedia" href="#/">
                <div class="hero-media-cover" id="heroMediaCover"></div>
                <span class="play-badge" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="18" height="18"><polygon points="6,4 20,12 6,20" fill="currentColor" /></svg>
                </span>
              </a>
            </div>
            <div class="grid" id="grid-home"></div>
            <footer class="site-footer" data-footer></footer>
          </div>
        </section>

        <section class="page" id="page-work" data-page="work">
          <div class="page-scroll">
            <div class="grid" id="grid-work"></div>
            <footer class="site-footer" data-footer></footer>
          </div>
        </section>

        <section class="page" id="page-info" data-page="info">
          <div class="page-scroll">
            <div class="info-content" id="infoContent"></div>
            <footer class="site-footer" data-footer></footer>
          </div>
        </section>

        <section class="page" id="page-sideb" data-page="sideb">
          <div class="page-scroll">
            <div class="intro">
              <p class="eyebrow" id="sidebEyebrow"></p>
            </div>
            <div class="sideb-content" id="sidebContent"></div>
            <footer class="site-footer" data-footer></footer>
          </div>
        </section>

      </div>

      <div class="project-view" id="project-view" hidden></div>

    </main>

  </div>

  <script src="data.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
