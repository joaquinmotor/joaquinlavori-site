<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Joaquin Lavori — Branding & Illustration</title>
<meta name="description" content="Joaquin Lavori is a graphic designer and illustrator working across branding, art direction and hand-drawn illustration." />
<!-- Favicon. El original que exporto el usuario esta en
     assets/img/favicon/favicon-source.png (1438x1438, circulo crema con el
     monograma JQ); el resto de los tamanios se derivan de ahi con PIL.
     NO va en la raiz del repo: .gitignore tiene /*.png y se lo comeria.
     El apple-touch-icon va aplanado sobre el color dominante y a sangre porque iOS
     ignora la transparencia (compone sobre negro) y pone su propia mascara. -->
<link rel="icon" href="assets/img/favicon/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32.png?v=2" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16.png?v=2" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon/favicon-192.png?v=2" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png?v=2" />
<meta name="theme-color" content="#F3F3F3" />
<link rel="stylesheet" href="styles.css?v=1787613458" />
</head>
<body>

  <header class="site-nav" id="siteNav"></header>

  <div class="layout" id="layout">

    <!-- Content is rendered per-page by renderSidebar() in script.js: Home/Work/Info
         get the compact Photo+About+Contact+Instagram card sidebar (Info adds 5 project
         preview cards), Side B hides the sidebar entirely. See notas.md. -->
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" id="main">

      <div class="pages-track" id="pagesTrack">

        <section class="page" id="page-home" data-page="home">
          <div class="page-scroll">
            <div class="hero" id="hero">
              <!-- Play badge removed 2026-08-11 (user request) — was a static
                   affordance that always sat over the hero regardless of
                   what it showed; no longer needed since nothing here needs
                   a "tap to play" hint. -->
              <a class="hero-media" id="heroMedia" href="#/">
                <div class="hero-media-cover" id="heroMediaCover"></div>
              </a>
              <p class="home-intro" id="homeIntro"></p>
            </div>
            <div class="home-tile-columns" id="grid-home">
              <div class="home-tile-column" id="grid-home-left"></div>
              <div class="home-tile-column" id="grid-home-right"></div>
              <!-- Desktop only (Home Desktop, z2Lknd, is a 3x3 grid); hidden on mobile via CSS -->
              <div class="home-tile-column" id="grid-home-third"></div>
            </div>
            <footer class="site-footer" data-footer></footer>
          </div>
        </section>

        <section class="page" id="page-work" data-page="work">
          <div class="page-scroll">
            <div class="grid" id="grid-work"></div>
            <!-- Desktop only (Work Desktop, Ghq1t: 3-col masonry catalog); hidden on mobile via CSS -->
            <div class="work-desktop-grid" id="grid-work-desktop"></div>
            <!-- Project detail view lives inside Work's page-scroll (not a
                 separate full-screen overlay) so it swipes/paginates with the
                 rest of the track like a normal page. #page-work.is-project-open
                 (toggled in script.js) hides the catalog above and shows this;
                 see notas.md "swipe stays working with an open project". -->
            <div class="project-view" id="project-view"></div>
            <footer class="site-footer" data-footer></footer>
          </div>
        </section>

        <section class="page" id="page-info" data-page="info">
          <div class="page-scroll">
            <div class="info-content" id="infoContent"></div>
            <!-- Desktop only (Info Desktop, X8g8f: 3 content columns, not a reflow
                 of the mobile layout above); hidden on mobile via CSS -->
            <div class="info-desktop" id="infoDesktop"></div>
            <footer class="site-footer" data-footer></footer>
          </div>
        </section>

        <section class="page" id="page-sideb" data-page="sideb">
          <div class="page-scroll">
            <div class="sideb-content" id="sidebContent"></div>
            <!-- Desktop only (Side B Desktop, BI3ZW: 4-track photo masonry, totally
                 different from the mobile grid above); hidden on mobile via CSS -->
            <div class="sideb-desktop" id="sidebDesktop"></div>
            <footer class="site-footer" data-footer></footer>
          </div>
        </section>

      </div>

    </main>

  </div>

  <script src="data.js?v=1787613458"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js?v=1787613458"></script>
</body>
</html>
